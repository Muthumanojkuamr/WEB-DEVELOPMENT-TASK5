<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Capstone E-Commerce Store for Hardware Components">
    <title>Capstone Store - Task 5</title>
    <style>
        /* Minified-style CSS for Performance Optimization */
        :root{--p:#1a5242;--w:#fff;--g:#f4f7f6;--t:#333}
        *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
        body{background:var(--g);color:var(--t)}
        header{background:var(--p);color:var(--w);padding:1rem;display:flex;justify-content:space-between;align-items:center}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}
        .card{background:var(--w);padding:15px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);text-align:center;transition:transform .2s}
        .card:hover{transform:translateY(-5px)}
        .card img{max-width:100%;height:150px;object-fit:cover;border-radius:4px;margin-bottom:10px}
        button{background:var(--p);color:var(--w);border:none;padding:10px 15px;border-radius:4px;cursor:pointer;width:100%;margin-top:10px}
        #cart-modal{display:none;position:fixed;top:50px;right:20px;background:var(--w);padding:20px;border-radius:8px;box-shadow:0 5px 15px rgba(0,0,0,.3);z-index:100;width:300px}
        @media(max-width:600px){header{flex-direction:column;text-align:center;gap:10px}}
    </style>
</head>
<body>
    <header>
        <h1>Hardware Components Store</h1>
        <div>
            <button onclick="toggleCart()" style="width:auto">Cart (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <div id="cart-modal">
        <h3>Your Cart</h3>
        <ul id="cart-items" style="list-style:none;margin:10px 0;max-height:200px;overflow-y:auto"></ul>
        <p><strong>Total: $<span id="cart-total">0.00</span></strong></p>
        <button onclick="toggleCart()">Close</button>
    </div>

    <div class="grid" id="store-grid">
        <!-- Products dynamically injected here -->
    </div>

    <script>
        // Capstone Features: Dynamic Rendering, LocalStorage Cart, Lazy Loading Images
        const storeProducts = [
            { id: 1, name: "8051 Microcontroller Dev Board", price: 25.00, img: "https://via.placeholder.com/250x150?text=8051+Board" },
            { id: 2, name: "EV Temp Sensor Module", price: 15.50, img: "https://via.placeholder.com/250x150?text=Temp+Sensor" },
            { id: 3, name: "Proteus Simulation Key", price: 50.00, img: "https://via.placeholder.com/250x150?text=Software+Key" },
            { id: 4, name: "16x2 LCD UI Enclosure", price: 8.99, img: "https://via.placeholder.com/250x150?text=LCD+Enclosure" }
        ];

        let cart = JSON.parse(localStorage.getItem('capstoneCart')) || [];

        function renderStore() {
            const grid = document.getElementById('store-grid');
            storeProducts.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <!-- Step 5.2: Lazy Loading for Performance -->
                        <img src="${p.img}" alt="${p.name}" loading="lazy">
                        <h3>${p.name}</h3>
                        <p>$${p.price.toFixed(2)}</p>
                        <button onclick="addToCart(${p.id})">Add to Cart</button>
                    </div>`;
            });
            updateCartUI();
        }

        function addToCart(id) {
            const product = storeProducts.find(p => p.id === id);
            cart.push(product);
            localStorage.setItem('capstoneCart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsList = document.getElementById('cart-items');
            itemsList.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                itemsList.innerHTML += `<li style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:14px">
                    <span>${item.name}</span>
                    <button onclick="removeFromCart(${index})" style="background:red;width:auto;padding:2px 5px;margin:0">X</button>
                </li>`;
            });
            document.getElementById('cart-total').innerText = total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('capstoneCart', JSON.stringify(cart));
            updateCartUI();
        }

        function toggleCart() {
            const modal = document.getElementById('cart-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        window.onload = renderStore;
    </script>
</body>
</html>
